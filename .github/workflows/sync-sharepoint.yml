name: Sync SharePoint snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Build latest snapshot
        run: python build_snapshot.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/fault_snapshot.csv.gz data/fault_snapshot.meta.txt; then
            echo "No snapshot changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fault_snapshot.csv.gz data/fault_snapshot.meta.txt
          git commit -m "Auto-sync SharePoint snapshot"
          git push
